<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Sanctuary</title>
  
  <!-- Soft, elegant typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body data-theme="light">

  <!-- PHASE 1: AUTHENTICATION -->
  <div id="auth-screen" class="fullscreen-view">
    <div class="auth-card">
      <h1 class="title-elegant">Sanctuary</h1>
      <p class="subtitle">A secure space for your thoughts.</p>
      
      <div id="step-google">
        <button id="btn-google-login" class="btn-primary">Sign in with Google</button>
      </div>
      
      <div id="step-password" class="hidden">
        <p class="user-greeting" id="user-email-display"></p>
        <input type="password" id="diary-password" placeholder="Enter your key..." class="input-minimal" autocomplete="off" />
        <button id="btn-unlock" class="btn-primary">Unlock</button>
      </div>
    </div>
  </div>

  <!-- PHASE 2: QUOTE OF THE DAY -->
  <div id="quote-screen" class="fullscreen-view hidden">
    <div class="quote-container">
      <p id="daily-quote-text" class="quote-text"></p>
      <p id="daily-quote-author" class="quote-author"></p>
      <button id="btn-enter-sanctuary" class="btn-secondary fade-in-delayed">Enter</button>
    </div>
  </div>

  <!-- PHASE 3: MAIN WORKSPACE -->
  <div id="main-workspace" class="hidden">
    
    <!-- Sidebar Navigation -->
    <nav id="sidebar">
      <h2 class="sidebar-title">Sanctuary</h2>
      <ul class="nav-links">
        <li class="nav-item active" data-target="view-journal">My Journal</li>
        <li class="nav-item" data-target="view-people">People & Lore</li>
        <li class="nav-item" data-target="view-lists">Lists & Tasks</li>
        <li class="nav-item" data-target="view-quotes">Saved Thoughts</li>
      </ul>
      <div class="cloud-status" id="cloud-indicator">Cloud: Synced</div>
    </nav>

    <!-- Main Content Area -->
    <main id="content-area">
      
      <!-- Top Bar: Controls -->
      <header class="top-bar">
        <div class="date-display" id="current-date"></div>
        <div class="window-controls">
          <button id="btn-theme-toggle" class="icon-btn" title="Toggle Day/Night" aria-label="Toggle Theme">
            <!-- Default to Moon icon -->
            <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <svg id="icon-sun" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          </button>
          <button id="btn-lock-diary" class="icon-btn" title="Lock Diary" aria-label="Lock">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </button>
        </div>
      </header>

      <!-- Dynamic Views (Controlled by JS) -->
      <section id="view-journal" class="view-section active">
        <div class="journal-layout">
          <!-- Left side: History -->
          <div class="journal-sidebar">
            <button id="btn-new-entry" class="btn-primary" style="margin-bottom: 20px;">+ New Page</button>
            <ul id="journal-history-list" class="history-list">
              <!-- JS will populate past entries here -->
            </ul>
          </div>
          <!-- Right side: Editor -->
          <div class="journal-editor">
            <div class="editor-header">
              <input type="text" id="entry-title" class="title-input" placeholder="What's on your mind?">
              <button id="btn-delete-entry" class="icon-btn btn-danger hidden" title="Delete Page" aria-label="Delete">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
            <textarea id="entry-body" class="journal-textarea" placeholder="Dear Diary..."></textarea>
          </div>
        </div>
      </section>

      <section id="view-people" class="view-section hidden">
        <div class="section-header">
          <h2 class="section-title">People & Lore</h2>
          <button id="btn-add-person" class="btn-primary" style="width: auto;">+ Add Profile</button>
        </div>
        <div id="people-grid" class="people-grid">
          <!-- JS will populate profile cards here -->
        </div>
        
        <!-- Add Person Modal -->
        <div id="modal-person" class="modal hidden">
          <div class="modal-content">
            <h3 class="modal-title" style="font-family: var(--font-title); font-size: 2rem; margin-bottom: 15px;">New Profile</h3>
            <input type="text" id="person-name" class="input-minimal" placeholder="Name">
            <div style="display: flex; gap: 10px;">
              <input type="text" id="person-age" class="input-minimal" placeholder="Age">
              <input type="text" id="person-relation" class="input-minimal" placeholder="Relation">
            </div>
            <input type="date" id="person-birthday" class="input-minimal" title="Birthday">
            <input type="text" id="person-likes" class="input-minimal" placeholder="Likes / Dislikes (e.g., Likes: Qawwalis. Dislikes: Chemistry.)">
            <textarea id="person-lore" class="journal-textarea" style="min-height: 120px; border-bottom: 1px solid var(--border-light); font-size: 1rem;" placeholder="Recent lore, life updates, etc..."></textarea>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
              <button id="btn-save-person" class="btn-primary">Save Profile</button>
              <button id="btn-close-person" class="btn-secondary">Cancel</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-lists" class="view-section hidden">
        <div class="section-header">
          <h2 class="section-title">Lists & Tasks</h2>
          <button id="btn-add-list" class="btn-primary" style="width: auto;">+ Create List</button>
        </div>
        <div id="lists-container" class="lists-container">
          <!-- JS will populate lists here -->
        </div>

        <!-- Add List Modal -->
        <div id="modal-list" class="modal hidden">
          <div class="modal-content">
            <h3 class="modal-title" style="font-family: var(--font-title); font-size: 2rem; margin-bottom: 15px;">New List</h3>
            <input type="text" id="list-title" class="input-minimal" placeholder="e.g., Bucket List, Reading List, Weekly Tasks...">
            <input type="text" id="list-first-item" class="input-minimal" placeholder="First item (e.g., Hit 1600 ELO in chess)">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
              <button id="btn-save-list" class="btn-primary">Create</button>
              <button id="btn-close-list" class="btn-secondary">Cancel</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-quotes" class="view-section hidden">
        <h2 class="section-title">Saved Thoughts</h2>
        <div id="saved-quotes-container" class="quotes-grid">
          <!-- JS will populate liked quotes here -->
        </div>
      </section>

    </main>
  </div>

  <!-- Core Engine Scripts -->
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modules.js"></script>
</body>
</html>
